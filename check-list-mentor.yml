introduction: >
  The methodology of School 21 makes sense only if peer-to-peer reviews are done seriously. Please read all guidelines carefully before starting the review.

  - Please, stay courteous, polite, respectful and constructive in all communications during this review.

  - Highlight possible malfunctions of the work done by the person and take the time to discuss and debate it.

  - Keep in mind that sometimes there can be differences in interpretation of the tasks and the scope of features. Please, stay open-minded to the vision of the other.

  - If you have not finished the project yet, it is compulsory to read the entire instruction before starting the review.

guidelines: >
  - Evaluate only the files that are in src folder on the GIT repository of the student or group.

  - Ensure to start reviewing a group project only when the team is present in full.

  - Use special flags in the checklist to report, for example, an “empty work” if repository does not contain the work of the student (or group) in the src folder of the develop branch, or “cheat” in case of cheating or if the student (or group) are unable to explain their work at any time during review as well as if one of the points below is not met. However, except for cheating cases, you are encouraged to continue reviewing the project to identify the problems that caused the situation in order to avoid them at the next review.

  - Doublecheck that the GIT repository is the one corresponding to the student or the group.

  - Meticulously check that nothing malicious has been used to mislead you.

  - In controversial cases, remember that the checklist determines only the general order of the check. The final decision on project evaluation remains with the reviewer.

quick_actions:
  - EMPTY_WORK
  - INVALID_COMPILATION
  - CODE_STYLE
  - LEAKS
  - CRASH
  - CHEAT
  - FORBIDDEN_FUNCTION
language: en
name: internship
comment: ""
sections:
  - kind: "1"
    name: Main part
    description: ""
    questions:
      - name: Работа в команде
        description: >
          - Студент нашел общий язык с коллегами, активно коммуницировал на протяжении всей стажировки

          - Студент приспособился к работе в коллективе и нашел свое место в команде
        rating: "6"
        
      - name: Самоорганизация
        description: >
          - Студент соблюдал организационные правила компании (график работы, режим доступа, дресс-код)

          - Студент был на связи в оговоренные промежутки времени 
          
          - Студент проявлял самостоятельность и инициативность в отношении выполняемой работы (самостоятельно искал информацию, советовался с коллегами, предлагал идеи и решения)
        rating: "6"
        
      - name: Креативность
        description: >
          - Студент предлал альтернативные технические и архитектурные решения или какие-либо оригинальные подходы к решению поставленных задач
        rating: "6"

      - name: Ответственность
        description: >
          - Студент ответственно подходил к выполнению поставленных задач, старался сделать все вовремя и на необходимом уровне качества

          - Студент проявлял инициативу, предпринимая действия, направленные на обеспечение выполнения поставленных задач в срок и в полном объеме
        rating: "6"
        
      - name: Технические навыки
        description: >
          - Студент активно использовал все заявленные технические навыки при исполнении рабочих обязанностей

          - Технические навыки студента отвечали корпоративным требованиям и ожиданиям

          - Студент развивал и углублял технические навыки в рамках выполнения рабочих задач
        rating: "6"
        
      - name: Object-oriented programming
        description: >
          - Студент работал с ООП в процессе выполнения задач. Выделял объекты, абстракции, перегружал методы и операторы, следовал основным принципам ООП (полиморфизм, инкапсуляция, абстракция, наследование)
          
          - Студент работал с шаблонными (generic) классами в процессе выполнения задач
          
          - Студент применял в своей работе основные архитектурные паттерны (например, фасад, фабрика, стратегия и другие)
          
          - Студент придерживался принципов SOLID в процессе своей работы
          
          - Студент применял паттерн Dependency Injection при выполнении рабочих задач 
          
          - Студент работал с архитектурными паттернами проектирования ПО  MV*-семейства такими, как: MVC, MVP, MVVM или им подобные
        rating: "6"
          
      - name: Types and data structures
        description: >
          - Студент создавал или применял базовые типы и структуры данных в процессе своей работы (например, списки, стек, очередь, словарь, дерево и т.д.)
          
          - Студент создавал или применял более сложные типы и структуры данных при выполнении рабочих задач (например, АВЛ-деревья, красно-черное дерево, различные графы и подобное)
        rating: "6"
        
      - name: Algorithms
        description: >
          - Студент применял алгоритмы обработки данных в своей работе
          
          - Студент применял алгоритмы поиска и упорядочивания данных в своей работе
          
          - Студент применял алгоритмы организации и хранения данных в своей работе
        rating: "6"

      - name: Backend
        description: >
          - Студент работал на позиции бекенд-разработчика
          
          - Студент применял MVC-подобные паттерны в своей работе с серверными приложениями
          
          - Студент работал с ORM фреймворками

          - Студент работал с базами данных

          - Студент проектировал и реализовывал API (REST, GRPC, SOAP и др.)
          
          - Студент применял принципы чистой архитектуры в процессе своей работы (разделение на слои, использование репозиториев для доступа к данным и т.д.)
        rating: "6"

      - name: Frontend
        description: >
          - Студент работал на позиции фронтенд-разработчика
          
          - Студент работал с фронтенд фреймворками (Angular, React, Vue и т.д.), либо разрабатывал фронтенд на чистом JS
          
          - Студент разделял представление и бизнес-логику в процессе выполнения рабочих задач
          
          - Студент работал с типизированным языком (TypeScript) при выполении задач
          
          - Студент использовал в работе сложные паттерны для реализации архитектуры (MVC-подобные, Redux и т.п.)

          - Студент реализовывал фронтенд по предоставленным дизайн-макетам/самостоятельно разрабатывал дизайн-макеты
        rating: "6"

      - name: Databases
        description: >
          - Студент работал с базами данных (реляционными/нереляционными), писал простейшие запросы на соответствующем языке к ним

          - Студент проектировал/разрабатывал базы данных
                  
          - Студент писал сложные запросы к базам данных на соединение разных таблиц, аггрегацию данных и аналитику
          
          - Студент создавал хранимые процедуры, функции и триггеры 
        rating: "6"
        
      - name: Mobile
        description: >
          - Студент создавал и работал с нативными мобильными приложениями (Android/IOS)

          - Студент использовал в работе паттерны для реализации архитектуры (MVC-подобные, MVU и т.п.)
                  
          - Студент разрабатывал пользовательский интерфейс
          
          - Студент разделял и разрабатывал такие слои, как: слой хранения данных, слой бизнес-логики и слой связи с сервером
        rating: "6"
          
      - name: ML & AI
        description: >
          - Студент работал с алгоритмами кластеризации и классификации данных
        
          - Студент работал с существующими моделями нейронных сетей (в том числе классифицирующими, аннотирующими и генеративными), создавал выборки, обучал модели, подбирал гиперпараметры
          
          - Студент создавал модели нейронных сетей самостоятельно с нуля (возможно с применением фреймворков для этого, в том числе классифицирующие, аннотирующие и генеративные)
        rating: "6"
          
      - name: Network & system administration
        description: >
          - Студент работал с администрированием систем, настраивал ОС семейства *nix, права доступа, сервисные приложения и утилиты (например, cron или systemd)
          
          - Студент настраивал сети и подсети предприятия, управлял маршрутизацией сетей 
          
          - Студент создавал правила для фаерволла, настраивал права доступа к сетевым ресурсам
        rating: "6"
        
      - name: DevOps
        description: >
          - Студент работал с настройкой CI/CD, писал скрипты, занимался сборкой и развертыванием ПО
          
          - Студент работал с готовыми Docker образами и контейнерами

          - Студент создавал свои Docker образы

          - Студент работал с системами оркестрации контейнеров (Swarm, Open Stack, K8S)

          - Студент развертывал и настраивал системы оркестрации контейнеров (Swarm, Open Stack, K8S)
          
          - Студент работал с подключением и настройкой инфраструктурного ПО, такого как, например: Zabbix, Grafana, Prometheus, GoAccess, ElasticSearch, Kibana и прочее.
        rating: "6"
        
      - name: Shell/Bash
        description: >
          - Студент писал bash-скрипты в процессе выполнения рабочих задач
          
          - Студент работал с такими утилитами, как: sed, awk и т.д. 
          
          - Студент создавал и подключал бибилиотеки на shell/bash
        rating: "6"
        
      - name: Analysis
        description: >
          - Студент разрабатывал и формализовывал бизнес-процессы (BPMN) в рамках рабочих задач

          - Сутдент разрабатывал и формализовывал пользовательские сценарии в рамках рабочих задач
          
          - Студент проектировал API и сценарии взаимодействия в рамках рабочих задач
          
          - Студент составлял и поддерживал техническую документацию
          
          - Студент разрабатывал и составлял технические задания
        rating: "6"        
        
      - name: QA
        description: >
          - Студент занимался ручным тестированием и отладкой приложений

          - Сутдент выполнял контроль качества выполняемых задач другими членами команды
          
          - Студент создавал модульные тесты в процессе своей работы
          
          - Студент создавал интеграционные тесты в процессе своей работы
          
          - Студент проводил регресионное тестирование в процессе своей работы
        rating: "6"
        
      - name: Functional programming
        description: >
          - Студент работал с чисто функциональными языками программирования
          
          - Студент использовал функциональные выражения в процессе своей работы на мультипарадигмальных языках программирования
        rating: "6"
        
      - name: Parallel computing
        description: >
          - Студент работал паралелльными вычислениями, создавал многопоточные приложения
          
          - Студент работал с многопроцессорными приложениями (например, с использованием фреймворка OpenMP)
        rating: "6"
        
      - name: Graphics
        description: >
          - Студент работал с графикой: писал свои шейдеры или шейдерные функции, создавал графические примитивы без использования библиотек и подобное
        rating: "6"
        
      - name: Electronics
        description: >
          - Студент работал с "железом" (IoT, собирал, настраивал и программировал устройства на базе микроконтроллеров и одноплатных компьютеров)
        
          - Студент работал с низкоуровненым программированием для плат и микросхем: писал программы на ассемблере, С и С++
          
          - Студент разрабатывал компоненты роботехнических копмлексов
        rating: "6"
